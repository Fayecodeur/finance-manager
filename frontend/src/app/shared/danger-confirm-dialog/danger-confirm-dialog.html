<div class="danger-dialog">
    <div class="icon-wrapper">
        <mat-icon>warning</mat-icon>
    </div>

    <h2 mat-dialog-title>{{ data.title }}</h2>

    <mat-dialog-content>
        <p>{{ data.message }}</p>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tapez "{{ data.confirmWord }}" pour confirmer</mat-label>
            <input matInput [(ngModel)]="inputValue" [ngModelOptions]="{standalone: true}" />
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="onCancel()">Annuler</button>
        <button mat-raised-button color="warn" type="button" [disabled]="!isValid" (click)="onConfirm()">
            Confirmer la suppression
        </button>
    </mat-dialog-actions>
</div>
